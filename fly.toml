# fly.toml — QARAU API (server-only) on Fly.io
#
# Деплой из КОРНЯ репозитория:
#   fly deploy --remote-only --ha=false --yes
#
# Integrated API stores records and private artifacts in MongoDB.

app = 'server-hidden-canyon-2603'
primary_region = 'arn'

[build]
  dockerfile = 'server/Dockerfile'

[env]
  NODE_ENV = 'production'
  API_PORT = '8080'
  QARAU_RUNTIME_MODE = 'integrated'
  ARTIFACT_STORE = 'mongodb'
  SOLANA_RPC_URL = 'https://api.devnet.solana.com'
  SOLANA_PROGRAM_ID = '63VZwKUPcWqo2JwpQHLxT4HHgQsMREpERZg3DpfSnnMw'
  # За Fly proxy клиентский IP и https приходят через заголовки.
  TRUST_PROXY = '1'
  COOKIE_SECURE = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'

[mounts]
  source = 'qarau_private'
  destination = '/app/server/data/private'
  initial_size = '1gb'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
