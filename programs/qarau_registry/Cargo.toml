[package]
name = "qarau-registry"
version = "0.1.0"
description = "Privacy-preserving QARAU Merkle-root registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "qarau_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
sha2 = "0.10.9"
